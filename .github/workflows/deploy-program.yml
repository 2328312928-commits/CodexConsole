# Builds the deploy program for Windows, macOS and Linux. macOS files are built on a Mac,
# because macOS only runs signed programs (this signs them ad hoc, with no Apple account).
#
# Run it from the Actions tab ("Run workflow") to get the files as a download, or push a tag
# such as deployer-v0.1.0 to also put them on a draft release of this repository.
name: Deploy program

on:
  workflow_dispatch:
  push:
    tags: ['deployer-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64 win-x64
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No install scripts: ssh2's optional native helpers are left out on purpose.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run package -- ${{ matrix.targets }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-program-${{ matrix.os }}
          path: deployer/release/codex-console-deploy-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/deployer-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - run: cd files && sha256sum codex-console-deploy-* > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "Deploy program ${GITHUB_REF_NAME#deployer-v}" --notes "Download the file for your computer and run it. 下载适合你电脑的文件并运行。" files/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
