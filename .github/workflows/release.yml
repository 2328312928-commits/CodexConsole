# Builds every download for Windows, macOS (Apple silicon and Intel) and Linux (x64 and ARM64):
# the deploy program and the console package, with SHA256SUMS.txt.
#
# Push a tag such as v0.1.0 to put them all on a draft release, then publish it on GitHub.
# "Run workflow" in the Actions tab builds and tests everything without uploading anything.
# Files go straight to the release: Actions artifact storage is too small for them.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "Codex Console ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-program:
    needs: draft
    # Also runs when there is no tag (and so no draft).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64 win-x64
          # macOS only runs signed programs, so these are built and signed (ad hoc) on a Mac.
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No install scripts: ssh2's optional native helpers are left out on purpose.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run package -- ${{ matrix.targets }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" release/codex-console-deploy-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  console:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # All five platforms: each package carries that platform's own Node.js and Codex, so no Mac is needed.
      - run: npm run package:portable
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" release/codex-console-*.zip release/codex-console-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  checksums:
    needs: [deploy-program, console]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # From the files as uploaded, so the list matches exactly what people download.
      - run: |
          mkdir files && cd files
          gh release download "$GITHUB_REF_NAME" --pattern 'codex-console-*'
          sha256sum codex-console-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
